[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticker-telemetry-jitter-guard"
version = "1.0.0"
description = "High-throughput NBBO jitter guard that clamps venue clock skew and scores inter-arrival bursts with a two-sample Allan deviation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TechieGoku2623" }]
dependencies = []

[project.optional-dependencies]
dev = ["black==24.8.0", "flake8==7.1.1"]

[project.scripts]
ticker-telemetry-jitter-guard = "ticker_telemetry_jitter_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
